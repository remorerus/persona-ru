name: Build Persona Russian APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/**'
      - '.github/workflows/build-persona-ru.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up Android build tools
        uses: android-actions/setup-android@v3

      - name: Install APKTool and build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jdk python3
          curl -fL --retry 3 https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar -o apktool.jar
          sdkmanager --install "build-tools;35.0.0"
          java -jar apktool.jar --version

      - name: Download and decode original Persona
        run: |
          curl -fL --retry 3 "https://github.com/remorerus/persona-ru/releases/download/v0.91-ru/Persona_v0.91.apk" -o Persona_v0.91.apk
          echo "Original SHA-256: $(sha256sum Persona_v0.91.apk | cut -d' ' -f1)"
          java -jar apktool.jar d -f Persona_v0.91.apk -o decoded

      - name: Apply Russian-only interface and translations
        run: python3 tools/localize_persona.py decoded tools/translations.json

      - name: Build unsigned APK
        run: |
          mkdir -p dist
          java -jar apktool.jar b decoded -o dist/Persona_v0.91-ru-unsigned.apk

      - name: Align and sign APK
        env:
          BUILD_TOOLS: ${{ env.ANDROID_HOME }}/build-tools/35.0.0
        run: |
          keytool -genkeypair -keystore persona-ru.keystore -alias persona-ru -keyalg RSA -keysize 2048 -validity 10000 -storepass persona123 -keypass persona123 -dname "CN=Persona Russian, O=Community, C=KZ"
          "$BUILD_TOOLS/zipalign" -f -p 4 dist/Persona_v0.91-ru-unsigned.apk dist/Persona_v0.91-ru-aligned.apk
          "$BUILD_TOOLS/apksigner" sign --ks persona-ru.keystore --ks-key-alias persona-ru --ks-pass pass:persona123 --key-pass pass:persona123 --out dist/Persona_v0.91-ru.apk dist/Persona_v0.91-ru-aligned.apk
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs dist/Persona_v0.91-ru.apk
          sha256sum dist/Persona_v0.91-ru.apk > dist/SHA256.txt

      - name: Publish APK to the existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload v0.91-ru dist/Persona_v0.91-ru.apk --clobber

      - uses: actions/upload-artifact@v4
        with:
          name: Persona-v0.91-Russian-APK
          path: |
            dist/Persona_v0.91-ru.apk
            dist/SHA256.txt
          retention-days: 30
